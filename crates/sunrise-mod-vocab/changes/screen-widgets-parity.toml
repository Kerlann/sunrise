why = """
Screen widgets reach NeoForge 26.3 parity across every engine-drawn screen (#6741, #972): \
`ScreenEvent.Init.Pre` (`screen_init_pre`) joins `screen_init_post` (v5), `ScreenWidgets` adds \
mutators, `clear`, and `press` backed by live `ClientHost::screen_widgets()`, and all 15 screen \
input hooks now take `&mut dyn ClientHost` so listeners can mutate open screen widgets directly \
(render hooks stay read-only while drawing reads the widget override table). `ButtonState.label` \
and `ScreenChild.label` are renamed to `message` to match vanilla's `AbstractWidget.getMessage`.
"""
migrate = """
