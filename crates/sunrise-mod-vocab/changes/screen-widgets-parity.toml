Change the host parameter on `Hooks::screen_key_*`, `screen_char_*`, and `screen_mouse_*` \
implementations from `&dyn ClientHost` to `&mut dyn ClientHost`. Listeners inspecting \
`ScreenWidgets::children()` now see every engine-drawn screen's controls, not only the pause \
and title screens.
