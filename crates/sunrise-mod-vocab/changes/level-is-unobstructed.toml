ids = ["handle:LevelRef::is_unobstructed"]
why = "A mod that writes a block from its own placement code can ask what `BlockItem.canPlace` asks first (#6036). `LevelRef::is_unobstructed(host, pos, state)` is `CollisionGetter.isUnobstructed(state, pos, CollisionContext.empty())`, the empty-context form of `BlockItem.canPlace`'s test (which passes `CollisionContext.placementContext(player)`; no player context is exposed): whether no entity that blocks building (`Entity.blocksBuilding`, a live non-spectator player, a mob, a minecart, a boat, a non-marker armor stand, an end crystal, primed TNT, a falling block that landed from a fall) overlaps the state's collision shape at `pos`, so a cable bus or a machine is not placed inside a mob or a player. The state need not be the one stored at `pos`; an empty collision shape is always unobstructed. It reads open server levels, active or parked, and is `Err(Stale)` for a stale handle and `Err(Unavailable)` on a client or when the shape cannot be evaluated."
migrate = "Nothing to change; code that approximated the check with `visit_entities_in` and `has_collisions` can call `is_unobstructed`."
